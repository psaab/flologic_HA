# FloLogic service actions.
#
# Every write action accepts the same optional targeting fields. With a single
# valve the target may be omitted. With multiple valves exactly one target is
# required: valve_id, device_id, or entity_id. Actions never fan out to
# valves the caller did not name.
set_flow_sensitivity:
  fields:
    value:
      required: true
      description: Flow sensitivity in oz/min (0-1000).
      selector:
        number:
          min: 0
          max: 1000
          mode: box
          step: 0.1
    valve_id:
      required: false
      description: FloLogic valve id or uuid to control.
      selector:
        text:
    device_id:
      required: false
      description: Home Assistant device id of the FloLogic valve.
      selector:
        device:
          integration: flologic
    entity_id:
      required: false
      description: One or more FloLogic entities; their valves are controlled.
      selector:
        entity:
          multiple: true
          integration: flologic
