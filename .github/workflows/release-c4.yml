name: Release Control4 driver

on:
  push:
    tags:
      - "c4-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate C4 release tag
        run: |
          python - <<'PY'
          import os
          import re
          from xml.etree import ElementTree
          cloud = ElementTree.parse("c4/cloud/driver.xml").getroot().findtext("version")
          valve = ElementTree.parse("c4/valve/driver.xml").getroot().findtext("version")
          tag = os.environ["GITHUB_REF_NAME"]
          assert re.fullmatch(r"c4-v[0-9]{10}", tag), "Expected c4-vYYYYMMDDNN"
          assert cloud == valve, f"Cloud and valve versions must match (lockstep): {cloud} vs {valve}"
          assert tag == f"c4-v{cloud}", "Tag must match the lockstep C4 manifest version"
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Check Lua style
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check --config-path c4/stylua.toml c4/src c4/tests c4/shared c4/cloud/cloud.lua c4/valve/valve.lua
      - name: Build and verify package
        run: |
          sh c4/scripts/package.sh
          python -m pytest -q
      - name: Extract this release's notes
        run: |
          python - <<'PY'
          import os
          import re
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("c4-v")
          text = open("c4/RELEASE_NOTES.md", encoding="utf-8").read()
          # The release carries the header plus ONLY this tag's section,
          # never the whole changelog.
          parts = re.split(r"(?m)^(?=Version \*\*[0-9]{10}\*\*)", text)
          header, sections = parts[0], parts[1:]
          assert sections, "No version sections in c4/RELEASE_NOTES.md"
          section = next(
              (p for p in sections if p.startswith(f"Version **{version}**")),
              None,
          )
          assert section is not None, f"No RELEASE_NOTES section for {version}"
          body = section.rstrip() + "\n"
          if header.strip():
              body = header.rstrip() + "\n\n" + body
          out = os.path.join(os.environ["RUNNER_TEMP"], "c4-release-notes.md")
          open(out, "w", encoding="utf-8").write(body)
          print(f"wrote {out}")
          PY
      - name: Publish C4 assets without replacing the HA latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Both split-driver assets ship under one tag (lockstep); gh errors
          # when either file is missing, so both are required. The split
          # valve ships as flologic_water_valve.c4z and must NEVER be
          # published as flologic_valve.c4z: that legacy monolith filename
          # would make installed monoliths offer the incompatible
          # companion as an update. Fail loudly if a stale file exists.
          test ! -e c4/flologic_valve.c4z
          gh release create "$GITHUB_REF_NAME" c4/flologic_cloud.c4z c4/flologic_water_valve.c4z \
            --verify-tag --latest=false \
            --title "FloLogic Control4 ${GITHUB_REF_NAME#c4-v}" \
            --notes-file "$RUNNER_TEMP/c4-release-notes.md"
